<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读设置</title><link rel="stylesheet" href="../样本样式.css"></head><body><main><header><h1>阅读设置</h1></header><div class="grid"><section class="card"><h2>设置阅读版面</h2><label for="fontSize">文字大小</label><select id="fontSize"><option value="normal">标准字号</option><option value="big">大字号</option></select><label for="spacing">段落行距</label><select id="spacing"><option value="compact">紧凑行距</option><option value="comfort">舒适行距</option></select><label class="check"><input type="checkbox" id="warm">使用暖色背景</label><div class="actions"><button class="primary" id="save">应用设置</button><button id="reset">恢复初始</button></div><p id="status" class="status" role="status">当前使用初始版面</p></section><section class="card"><h2>阅读预览</h2><div id="preview" class="preview"><strong>城市中的绿意</strong><p>清晨沿着街角向前，树叶的影子落在长椅上。留一点时间观察身边的植物，熟悉的街道也会带来新的发现。</p></div><p id="applied" class="muted">已应用：标准字号 · 紧凑行距 · 白色背景</p></section></div><footer>本地演示 · N01-v1 · 操作仅在当前页面生效</footer></main><script>const font=document.querySelector('#fontSize'),space=document.querySelector('#spacing'),warm=document.querySelector('#warm'),preview=document.querySelector('#preview'),status=document.querySelector('#status'),applied=document.querySelector('#applied'),save=document.querySelector('#save'),reset=document.querySelector('#reset');let timer;save.onclick=()=>{save.disabled=true;reset.disabled=true;save.textContent='正在应用…';status.textContent='正在应用阅读设置，请稍候';const f=font.value,s=space.value,w=warm.checked;timer=setTimeout(()=>{preview.className='preview '+(f==='big'?'big ':'')+(s==='comfort'?'comfort ':'')+(w?'warm':'');applied.textContent='已应用：'+(f==='big'?'大字号':'标准字号')+' · '+(s==='comfort'?'舒适行距':'紧凑行距')+' · '+(w?'暖色背景':'白色背景');status.textContent='设置已应用';save.disabled=false;reset.disabled=false;save.textContent='应用设置'},700)};reset.onclick=()=>{clearTimeout(timer);font.value='normal';space.value='compact';warm.checked=false;preview.className='preview';applied.textContent='已应用：标准字号 · 紧凑行距 · 白色背景';status.textContent='已恢复初始版面'};</script></body></html>
