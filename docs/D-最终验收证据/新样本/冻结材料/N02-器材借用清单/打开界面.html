<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>器材借用清单</title><link rel="stylesheet" href="../样本样式.css"></head><body><main><header><h1>器材借用清单</h1></header><p class="muted">选择各类器材的借用数量，然后生成本次清单。</p><div class="grid"><section class="card"><h2>选择器材</h2><div id="items"></div><div class="actions"><button id="build" class="primary" disabled>生成清单</button><button id="clear">清空选择</button></div><p class="status" id="status" role="status">请先选择至少一件器材</p></section><section class="card"><h2>本次借用预览</h2><p id="empty" class="muted">生成清单后，在这里核对器材和数量。</p><div id="result" class="hidden"><table><thead><tr><th>器材</th><th>数量（件）</th></tr></thead><tbody id="rows"></tbody></table><p class="total" id="total"></p></div></section></div><footer>本地演示 · N02-v1 · 操作仅在当前页面生效</footer></main><script>const names=['投影仪','无线麦克风','三脚架'],counts=[0,0,0];let generated=false;const root=document.querySelector('#items'),build=document.querySelector('#build'),status=document.querySelector('#status');names.forEach((name,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML='<strong>'+name+'</strong><div class="stepper"><button aria-label="减少'+name+'" data-i="'+i+'" data-d="-1">−</button><output id="n'+i+'">0</output><button aria-label="增加'+name+'" data-i="'+i+'" data-d="1">+</button></div>';root.append(row)});function render(){names.forEach((n,i)=>{document.querySelector('#n'+i).textContent=counts[i];root.querySelector('[data-i="'+i+'"][data-d="-1"]').disabled=counts[i]===0;root.querySelector('[data-i="'+i+'"][data-d="1"]').disabled=counts[i]===8});build.disabled=counts.every(n=>n===0);if(generated){document.querySelector('#rows').innerHTML=names.map((n,i)=>counts[i]?'<tr><td>'+n+'</td><td>'+counts[i]+'</td></tr>':'').join('');document.querySelector('#total').textContent='借用总数量：'+counts.filter(n=>n>0).length+' 件';status.textContent='清单已更新，可继续调整数量'}}root.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.i);counts[i]=Math.max(0,Math.min(8,counts[i]+Number(b.dataset.d)));render()};build.onclick=()=>{generated=true;document.querySelector('#empty').classList.add('hidden');document.querySelector('#result').classList.remove('hidden');render();status.textContent='清单已生成，请核对右侧预览'};document.querySelector('#clear').onclick=()=>{counts.fill(0);generated=false;document.querySelector('#empty').classList.remove('hidden');document.querySelector('#result').classList.add('hidden');status.textContent='已清空选择';render()};render();</script></body></html>
