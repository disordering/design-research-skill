<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图书编目录入</title><link rel="stylesheet" href="../样本样式.css"></head><body><main><header><h1>图书编目录入</h1></header><p class="muted">填写图书信息。出版年份范围为 1900–2026。</p><div class="grid"><section class="card"><h2>图书信息</h2><form id="form" novalidate><label for="book">书名</label><input id="book" type="text" autocomplete="off" aria-describedby="bookError"><p class="error" id="bookError" role="alert"></p><label for="author">作者</label><input id="author" type="text" autocomplete="off" aria-describedby="authorError"><p class="error" id="authorError" role="alert"></p><label for="year">出版年份</label><input id="year" type="number" min="1900" max="2026" aria-describedby="yearError"><p class="error" id="yearError" role="alert"></p><div class="actions"><button type="submit" class="primary">保存图书</button><button type="button" id="reset">清空表单</button></div></form><p class="status" id="status" role="status">请填写完整后保存</p></section><section class="card"><h2>保存结果</h2><p id="record" class="muted">尚未保存图书记录</p></section></div><footer>本地演示 · N03-v1 · 操作仅在当前页面生效</footer></main><script>const form=document.querySelector('#form'),book=document.querySelector('#book'),author=document.querySelector('#author'),year=document.querySelector('#year'),status=document.querySelector('#status');function clearErrors(){['book','author','year'].forEach(id=>{document.querySelector('#'+id+'Error').textContent='';document.querySelector('#'+id).removeAttribute('aria-invalid')})}function err(id,text){document.querySelector('#'+id+'Error').textContent=text;document.querySelector('#'+id).setAttribute('aria-invalid','true')}form.onsubmit=e=>{e.preventDefault();clearErrors();let invalid=false;if(!book.value.trim()){err('book','请填写书名');invalid=true}if(!author.value.trim()){err('author','请填写作者');invalid=true}const y=Number(year.value);if(!year.value||!Number.isInteger(y)||y<1900||y>2026){err('year','出版年份须为 1900–2026 之间的整数');book.value='';invalid=true}if(invalid){status.textContent='保存未完成，请按字段提示修正后重试';return}document.querySelector('#record').textContent='书名：'+book.value.trim()+'；作者：'+author.value.trim()+'；出版年份：'+year.value;status.textContent='图书记录已保存'};document.querySelector('#reset').onclick=()=>{form.reset();clearErrors();status.textContent='已清空表单'};</script></body></html>
