<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>明鉴 · 协同评审</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="session.css"><body><header><a class="brand" href="index.html">明鉴 <small>协同交互评审</small></a><a href="index.html">返回截图评审</a></header><main><h1>围绕任务，核对方案与证据</h1><p class="muted">材料 → 共享理解 → 检查与交流 → 新版复审 → 报告</p><div class="panel"><button id="cap" class="secondary">检查后端能力</button><span id="capText"> 尚未检查</span></div><details id="intake" open><summary>新建评审 / 添加材料</summary><section class="panel"><h2>材料工作区</h2><p>登记的材料只在创建会话、补充材料或提交新版时发送。</p><div class="row"><label>材料类型<select id="kind"><option value="website">网站</option><option value="figma_board">Figma 画板</option><option value="figma_prototype">Figma 原型</option><option value="document">文档</option><option value="image">图片</option></select></label><label>材料角色<select id="role"><option value="unspecified">未指定</option><option value="product_spec">策划 / 正式需求</option><option value="design_brief">设计目的</option><option value="design">设计方案</option><option value="implementation">工程实现说明</option><option value="expert_opinion">专家意见</option><option value="user_statement">用户说明</option></select></label></div><label>材料标题<input id="sourceTitle" maxlength="200"></label><label>链接<input id="reference" placeholder="仅填完整 https:// 链接；上传文件时留空" type="url" maxlength="4000"></label><label>文本内容（文档可直接粘贴）<textarea id="content" maxlength="150000"></textarea></label><label>文件（图片或 PDF / DOCX / 文本；文档最大 8 MB）<input id="file" type="file" accept="image/png,image/jpeg,image/webp,.pdf,.docx,.txt,.md,.html,.csv"></label><label>材料版本<input id="sourceVersion" maxlength="200" placeholder="例如 v1 / 2026-11-03；不知道可留空"></label><button id="add" class="secondary">加入待提交材料</button><div id="drafts"></div></section><form id="create" class="panel"><h2>创建协同评审</h2><label>本次评审委托<textarea id="purpose" required maxlength="12000" placeholder="例如：检查从入口到完成任务的流程"></textarea></label><label>原始设计目的（选填）<textarea id="designPurpose" maxlength="12000"></textarea></label><label>目标用户（选填）<input id="targetUser" maxlength="2000"></label><label>审核者 / 操作者<input id="actor" maxlength="200" placeholder="填写本人姓名或小组标识"></label><label>操作者类型<select id="actorType"><option value="human">本人操作</option><option value="ai">AI 模拟操作</option></select></label><div class="row"><label>模型来源<select id="provider"><option>qwen</option><option>deepseek</option><option selected>generic</option><option>local</option></select></label><label>模型名称（选填）<input id="model" value="qwen3.8-flash" maxlength="200"></label></div><div class="row"><label>最多模型调用次数<input id="maxCalls" type="number" min="1" max="100" value="20"></label><label>最长运行秒数<input id="maxSeconds" type="number" min="10" max="7200" value="600"></label></div><label><input id="interact" type="checkbox">允许任务范围内普通交互；具体待授权动作另行确认</label><label><input id="auto" type="checkbox">创建后立即运行（会调用模型，可能产生费用）</label><button class="primary">创建会话</button></form></details><section class="panel"><h2>恢复会话</h2><label>会话 ID<input id="restoreId"></label><button id="restore" class="secondary">从后端恢复</button><div id="recent"></div></section><section id="work" hidden><div class="panel"><h2 id="sessionTitle"></h2><p id="progress"></p><label>报告版本<select id="versions"></select></label><div class="actions"><button id="refresh">刷新当前会话</button><button data-event="resume">开始 / 继续运行（调用模型）</button><button data-event="finish">结束本轮并生成报告</button><button data-event="cancel">取消运行</button></div><p class="muted">结束表示交付当前结果；未执行项目仍显示未完成。接收事件不等于检查完成。</p></div><div id="understanding" class="panel"></div><div id="materials" class="panel"></div><div id="questions" class="panel"></div><div id="findings"></div><div id="rechecks" class="panel"></div><details class="panel"><summary>逐屏技术审查与检查计划</summary><div id="checks"></div></details><form id="reply" class="panel"><h2>补充、变更与重查</h2><label>事件类型<select id="eventType"><option value="reply">补充说明 / 异议</option><option value="change_goal">修改评审委托</option><option value="change_scope">修改检查范围</option></select></label><label>内容<textarea id="replyText" maxlength="12000" required></textarea></label><button class="primary">提交并触发重查（调用模型）</button><button type="button" id="sendSources" class="secondary">补充待提交材料（触发重查）</button><label>新版对应的旧材料<select id="replaceSource"></select></label><button type="button" id="recheck" class="secondary">用一项待提交材料替换并复审</button></form><section class="panel"><h2>报告与证据交付</h2><div id="exports" class="actions"></div><p class="muted">Markdown 人审稿、摘要、审计稿、JSON 和 ZIP 均由 B 生成；有图片附件时优先下载 ZIP。</p></section></section><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="session-ui.js"></script></body></html>
